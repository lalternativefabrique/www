# Not a monorepo — this file exists because pnpm moved settings here out of the
# "pnpm" field in package.json. pnpm 10+ blocks dependency build scripts unless
# they are whitelisted; esbuild needs its postinstall to fetch its native
# binary, without which `vite build` fails.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true

# Reached only through cheerio, itself pulled by the build plugin and never run
# in production — but the image scan sees it on disk, and the fixed release is a
# drop-in. Drop this once the dependency chain ships it on its own.
overrides:
  undici: '>=7.28.0'
