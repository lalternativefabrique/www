# Not a monorepo — this file exists because pnpm moved settings here out of the
# "pnpm" field in package.json. pnpm 10+ blocks dependency build scripts unless
# they are whitelisted; esbuild needs its postinstall to fetch its native
# binary, without which `vite build` fails.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true

# Reached only through cheerio, itself pulled by the build plugin and never run
# in production — but the image scan sees it on disk, and the fixed release is a
# drop-in. Drop this once the dependency chain ships it on its own.
overrides:
  undici: '>=7.28.0'
  # Reached through xmlbuilder2, pulled by the build plugin. Same story as
  # undici: never executed here, but on disk where the scan reads it.
  js-yaml: '>=4.3.1'
  # Reached through Babel, itself pulled by the TanStack router plugin — build
  # tooling that never runs in the served image, but ships inside it.
  browserslist: '>=4.28.7'
  # Reached through remark-mdx-frontmatter. The 3.x line is unmaintained and
  # carries the fix in 4.x, so this crosses a major — safe here because the
  # articles' frontmatter is YAML and remarkFrontmatter is left at its default,
  # so nothing in this repo ever hands TOML to it. Pinned to the 5.x line
  # rather than left open, so a later major lands in a commit that tests it.
  toml: '^5.0.0'
