# yaml-language-server: $schema=https://raw.githubusercontent.com/digstack/skalpai/main/apps/sklp/pipeline/pipeline.schema.json
version: 1
kind: pipeline
name: publish
space: false

require:
  branches: [main]
  clean_tree: true

tag:
  strategy: date-sha

registry:
  provider: scaleway

tools:
  node: "24.16.0"
  pnpm: "11.3.0"

# Single service: the whole repo builds one image. The scope mirrors ci.yaml's
# `web`, plus the files that only affect packaging (Dockerfile, server.js,
# pnpm-workspace.yaml) and would otherwise not trigger a rebuild.
scopes:
  web:
    - "app/**"
    - "public/**"
    - "vite.config.ts"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - "tsconfig.json"
    - "Dockerfile"
    - "server.js"
  migrate:
    - "apps/migrations/**"
  shared:
    - ".sklp/**"

steps:
  - name: web
    kind: publish
    scope: [web, shared]
    context: .
    dockerfile: Dockerfile
    image: rg.fr-par.scw.cloud/lalternative/www
    tag: "{{ publish_tag }}"

  # The SQL is the image, so a new migration is a new tag — and that tag is what
  # ArgoCD diffs to decide the Job must run again. Scoped to apps/migrations so
  # a deploy that changes no schema does not restate one.
  - name: migrate
    kind: publish
    scope: [migrate, shared]
    context: apps/migrations
    dockerfile: apps/migrations/Dockerfile
    image: rg.fr-par.scw.cloud/lalternative/migrate
    tag: "{{ publish_tag }}"
