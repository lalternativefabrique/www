# yaml-language-server: $schema=https://raw.githubusercontent.com/digstack/skalpai/main/apps/sklp/pipeline/pipeline.schema.json
version: 1
kind: pipeline
name: ci

# Tool versions come from runner.toolchain in .sklp/space.yaml (the execution
# environment). A top-level `tools:` here would only re-pin or add to it.

scopes:
  web:
    - "app/**"
    - "public/**"
    - "vite.config.ts"
    - "package.json"
    - "pnpm-lock.yaml"
    - "tsconfig.json"
    - "server.js"
  migrations:
    - "apps/migrations/**"

steps:
  # Checked here rather than discovered in the cluster: golang-migrate reads the
  # directory as a set, and a malformed one is rejected whole.
  - name: check-migrations
    scope: [migrations]
    tools: []
    run: |
      cd apps/migrations
      fail=0
      for up in *.up.sql; do
        [ -e "$up" ] || { echo "no .up.sql files found"; exit 1; }
        down="${up%.up.sql}.down.sql"
        if [ ! -f "$down" ]; then echo "missing down for $up"; fail=1; fi
      done
      for f in *.up.sql *.down.sql; do
        echo "$f" | grep -Eq '^[0-9]{6}_[a-z0-9_]+\.(up|down)\.sql$' || { echo "bad name: $f"; fail=1; }
      done
      # Two branches merging in the same window each take the next free number
      # and neither conflicts in git — the collision only exists once both are
      # on main. golang-migrate then refuses the whole directory ("duplicate
      # migration file") and applies NOTHING.
      dupes=$(ls *.up.sql | cut -c1-6 | sort | uniq -d)
      if [ -n "$dupes" ]; then
        echo "duplicate migration version(s): $dupes"
        for v in $dupes; do ls "$v"_*; done
        fail=1
      fi
      exit $fail

  # Build first, because the typecheck cannot run without it.
  #
  # app/routeTree.gen.ts is generated by the TanStack plugin and gitignored, so
  # a clean checkout does not have one and `tsc` fails on every route in the
  # app — including the ones a change never touched. Typechecking first would
  # fail sooner, which is why it used to come first, but it fails on the
  # missing artefact rather than on the code. The build is a few seconds here
  # and produces what the typecheck needs.
  - name: web-build
    scope: [web]
    tools: [node, pnpm]
    run: pnpm build

  - name: web-typecheck
    scope: [web]
    tools: [node, pnpm]
    run: pnpm typecheck
