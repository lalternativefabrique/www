apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lalter-www
  namespace: argocd
  annotations:
    # After the migrations (wave 1): the pods here read a schema the Job is
    # responsible for putting in place, and no longer migrate at boot.
    argocd.argoproj.io/sync-wave: "2"
    link.argocd.argoproj.io/web: "https://lalternativefabrique.org"
    # `sklp run publish` pushes an immutable YYYYMMDD-HHMM-sha tag; the updater
    # picks the newest build and writes it back to git, so a merged publish
    # rolls out without a manual bump here.
    argocd-image-updater.argoproj.io/image-list: "www=rg.fr-par.scw.cloud/lalternative/www"
    argocd-image-updater.argoproj.io/www.update-strategy: newest-build
    argocd-image-updater.argoproj.io/www.kustomize.image-name: rg.fr-par.scw.cloud/lalternative/www
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lalter
  source:
    repoURL: https://github.com/lalternativefabrique/www.git
    targetRevision: main
    path: infra/k8s/overlays/production-www
  destination:
    server: https://kubernetes.default.svc
    namespace: lalternative-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
