# Everything the database needs, out of the two secret stores that already
# hold it: the app's own entry in SCW Secret Manager, and the bucket
# credentials the kube-infra buckets stack provisions.
#
# All three land before the Cluster is created (sync-wave -1): CNPG reads
# postgres-superuser while bootstrapping, and the ObjectStore reads
# postgres-backup-creds on its first WAL archive.
#
# Addressed by path, where spore and lungor use `name:` — their entries sit at
# the root of the secret manager and this one lives under /lalternative/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lalter-www
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: lalter-www
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # Merge, so every key of the SCW entry reaches the pod as it is —
      # BETTER_AUTH_SECRET, SPORE_API_KEY — with only DATABASE_URL composed
      # below. Adding a variable there needs no change here.
      #
      # BETTER_AUTH_URL and SPORE_FROM are NOT here: they are the site's public
      # address and its sending address, both declared as plain env in
      # base-www/www.yaml. This entry holds what must not be read.
      type: Opaque
      mergePolicy: Merge
      data:
        # Composed here rather than passed as separate host/user/password: the
        # app reads one connection string, and assembling it in the manifest
        # keeps the service name next to the database it points at.
        DATABASE_URL: "postgres://lalter:{{ .POSTGRES_PASSWORD }}@postgres-rw.lalternative-prod.svc.cluster.local:5432/lalter?sslmode=disable"
  dataFrom:
    - extract:
        key: path:/lalternative/lalternative-production
---
# The role CNPG bootstraps the cluster with, and connects as afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: postgres-superuser
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # CNPG expects basic-auth for both superuserSecret and initdb.secret.
      type: kubernetes.io/basic-auth
      data:
        username: "lalter"
        password: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: path:/lalternative/lalternative-production
---
# S3 credentials for barman-cloud. Distinct from the app's bucket credentials
# above: this is the same OVH user, but CNPG reads the two keys under the names
# it expects and does not know the JSON blob they come from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-creds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: postgres-backup-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ACCESS_KEY_ID: "{{ .access_key }}"
        SECRET_ACCESS_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: path:/platform-ops/buckets/ovh/lalternative/ovh-buckets-lalternative-credentials
