# The www pod and the migration Job reaching Postgres. Egress is unrestricted
# in this namespace, so only the database side needs a rule.
#
# The Job is listed here rather than in its own policy because it is the same
# permission: without it the namespace's default-deny drops the connection and
# the Job fails on a timeout that reads as a database outage.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-www-to-postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lalter-www
        - podSelector:
            matchLabels:
              app: db-migration
      ports:
        - protocol: TCP
          port: 5432

---
# The operator reaching its own instance. Without this the Cluster never leaves
# "Instance Status Extraction Error": the namespace denies ingress by default,
# and CNPG polls the instance manager over 8000 to know whether the pod is
# healthy — 9187 is the metrics port it scrapes alongside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-system-to-postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
