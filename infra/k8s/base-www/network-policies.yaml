apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# The only ingress this namespace needs: Traefik reaching the site. The app
# does hold an API and an admin now, but both are reached from outside through
# Traefik like everything else — no in-cluster caller opens a connection here.
#
# Egress is deliberately unrestricted: the pod reaches object storage, Postgres
# and the mailer, none of which are in this cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-www
spec:
  podSelector:
    matchLabels:
      app: lalter-www
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
