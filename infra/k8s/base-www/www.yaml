apiVersion: v1
kind: Service
metadata:
  name: lalter-www
  labels:
    app: lalter-www
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app: lalter-www

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lalter-www
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The site is stateless static content, so a surge costs nothing and
      # keeps the rollout from ever dropping to zero ready pods.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: lalter-www
  template:
    metadata:
      labels:
        app: lalter-www
    spec:
      imagePullSecrets:
        # Projected into this namespace by the platform-wide
        # ClusterExternalSecret in kube-infra
        # (stacks/platform/ovh/forge-v1.ts) — it reads the shared
        # `/dockerconfig` Scaleway secret and fans it out to the namespaces
        # listed in `appNamespaces` there. A namespace missing from that list
        # gets no pull secret and every pod here fails ImagePullBackOff, so
        # `lalternative-prod` must stay in it.
        - name: scw-registry-credentials
      securityContext:
        # 1000 is the `node` user baked into the official image; the Dockerfile
        # already sets USER 1000:1000, restated here so the admission policy can
        # see it without resolving the image.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: lalter-www
          image: rg.fr-par.scw.cloud/lalternative/www:SET_BY_KUSTOMIZE
          imagePullPolicy: Always
          ports:
            # Matches PORT in the Dockerfile. A high port means the unprivileged
            # user binds it without CAP_NET_BIND_SERVICE.
            - containerPort: 8080
              name: http
          env:
            # The origin Better Auth accepts requests from. It compares this to
            # the request's own origin and answers "Invalid origin" on a
            # mismatch, so an unset value means nobody can sign in: the default
            # in auth.ts is localhost:3000, which no browser reaching this pod
            # will ever send.
            #
            # Declared here rather than in the secret, next to the ingress that
            # serves the same host: this is the site's public address, already in
            # ingress.yaml and in every page it serves, so a vault round-trip
            # would guard a value the HTML publishes. The apex, not www — that
            # host redirects here.
            - name: BETTER_AUTH_URL
              value: https://lalternativefabrique.org
            # The address the verification and sign-in mails come from. A
            # different domain from the site, and the one that has to be
            # verified in Spore for any of them to be delivered.
            - name: SPORE_FROM
              value: contact@lalter.org
            # The voice the admin narrates articles with — the Piper container
            # in the ai namespace, which costs nothing per article and keeps the
            # audio on infrastructure we run. Not a secret: it is a cluster
            # address, and the service takes no key.
            #
            # Unset, the narration button reports that no voice is configured
            # and nothing else changes: the audio a reader hears is served from
            # the bucket, and no request path touches this.
            - name: TTS_URL
              value: http://piper.ai.svc.cluster.local:5000
          envFrom:
            # Bucket credentials, from the ExternalSecret that mirrors what the
            # kube-infra buckets stack provisions. Not optional: without it the
            # site serves the .mdx sources baked into the image and every
            # article published since the last build is missing.
            - secretRef:
                name: lalter-www-s3
            # Database, auth secret and mailer key. Optional so a cluster
            # without it still serves the public site — but the admin cannot
            # run: no database means no session, and no mailer means no sign-in.
            - secretRef:
                name: lalter-www
                optional: true
          readinessProbe:
            httpGet:
              # Answered by server.js before the router, so a probe reports on
              # the process rather than on the bucket or the database.
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            # Node holding the compiled article cache, not nginx serving files:
            # the floor is the runtime and the corpus it keeps in memory. The
            # previous 128Mi ceiling was sized for nginx and would OOM-kill this
            # image on the first cold cache.
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # readOnlyRootFilesystem leaves nothing writable, and Node still
            # wants a temp directory for its own scratch files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
