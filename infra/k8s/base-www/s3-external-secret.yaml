# S3 credentials for the www pod: the bucket holding the article sources.
#
# Sourced from the SCW Secret Manager entry that the kube-infra
# OvhBucketsV1Stack manages — every cdktf deploy rotates the OVH user and
# pushes fresh credentials there, so this stays in sync without anyone
# copying a key by hand.
#
# Endpoint and region come from the same blob rather than being restated
# here: the stack decides which OVH region the bucket lives in, and a second
# copy would be one more thing to keep in step.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lalter-www-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: scaleway-secret-store
    kind: ClusterSecretStore
  target:
    name: lalter-www-s3
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        S3_ENDPOINT: "{{ .endpoint }}"
        S3_REGION: "{{ .region }}"
        S3_ACCESS_KEY: "{{ .access_key }}"
        S3_SECRET_KEY: "{{ .secret_key }}"
        # `buckets` is the map the stack builds from each bucket's key; this
        # app declares a single one, under `content`.
        S3_BUCKET: "{{ (fromJson .buckets).content }}"
  # SCW stores the secret as an opaque JSON blob — extract it whole and let
  # the template above pick the fields out.
  dataFrom:
    - extract:
        key: path:/platform-ops/buckets/ovh/lalternative/ovh-buckets-lalternative-credentials
