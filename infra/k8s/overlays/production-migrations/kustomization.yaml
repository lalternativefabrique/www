apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lalternative-prod

resources:
  - job.yaml

# Rewritten in place by argocd-image-updater. Immutable date-sha, never latest.
# A newer migrate image is what makes ArgoCD run the Job again.
#
# The seed below is a placeholder that no registry holds: it matches the
# allow-tags pattern, so the updater sorts every real tag above it and replaces
# it on the first publish. Until then the Job cannot pull, which is the correct
# state for a schema nobody has published yet.
images:
  - name: rg.fr-par.scw.cloud/lalternative/migrate
    newTag: "00000000-0000-0000000"

labels:
  - pairs:
      environment: production
      app.kubernetes.io/component: migrations
    includeSelectors: false
