<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
  <title id="title">Adoption de l'IA générative par les TPE et PME françaises</title>
  <desc id="desc">La part des entreprises utilisatrices passe de 15 % fin 2023 à 31 % en 2025 puis 55 % en janvier 2026. Parmi les non-utilisatrices, 65 % ne voient pas encore d'usage.</desc>
  <rect width="1536" height="900" fill="#f5f1ea"/>
  <g fill="#1a1a1a" font-family="Inter, Arial, sans-serif">
    <text x="72" y="92" font-family="Georgia, serif" font-size="48">L'usage a plus que triplé en deux ans</text>
    <text x="72" y="138" font-size="21" fill="#555">Part des TPE et PME françaises déclarant utiliser l'IA générative</text>

    <g transform="translate(86 220)">
      <line x1="0" y1="420" x2="870" y2="420" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="420" stroke="#1a1a1a" stroke-width="3"/>
      <g stroke="#1a1a1a" stroke-opacity=".15" stroke-width="2">
        <line x1="0" y1="350" x2="870" y2="350"/><line x1="0" y1="280" x2="870" y2="280"/>
        <line x1="0" y1="210" x2="870" y2="210"/><line x1="0" y1="140" x2="870" y2="140"/>
        <line x1="0" y1="70" x2="870" y2="70"/>
      </g>
      <g font-size="18" fill="#666" text-anchor="end">
        <text x="-18" y="426">0</text><text x="-18" y="356">10</text><text x="-18" y="286">20</text>
        <text x="-18" y="216">30</text><text x="-18" y="146">40</text><text x="-18" y="76">50</text>
      </g>
      <g fill="#1a1a1a">
        <rect x="90" y="315" width="160" height="105"/>
        <rect x="355" y="203" width="160" height="217"/>
        <rect x="620" y="35" width="160" height="385"/>
      </g>
      <g font-family="Georgia, serif" font-size="54" text-anchor="middle">
        <text x="170" y="290">15 %</text><text x="435" y="178">31 %</text><text x="700" y="10">55 %</text>
      </g>
      <g font-size="19" text-anchor="middle" fill="#555">
        <text x="170" y="462">Fin 2023</text><text x="435" y="462">2025</text><text x="700" y="462">Jan. 2026</text>
      </g>
      <path d="M170 282 C270 258 330 215 435 170 S600 52 700 14" fill="none" stroke="#e63946" stroke-width="5" stroke-dasharray="10 12"/>
    </g>

    <line x1="1030" y1="210" x2="1030" y2="712" stroke="#1a1a1a" stroke-width="2"/>
    <g transform="translate(1090 236)">
      <text x="0" y="0" font-size="18" letter-spacing="3">LE FREIN PRINCIPAL</text>
      <text x="0" y="106" font-family="Georgia, serif" font-size="112">65 %</text>
      <text x="0" y="164" font-family="Georgia, serif" font-size="30">des non-utilisateurs</text>
      <text x="0" y="206" font-family="Georgia, serif" font-size="30">n'identifient aucun usage</text>
      <g transform="translate(0 266)" fill="none" stroke="#1a1a1a" stroke-width="4">
        <path d="M0 100h300"/><path d="M48 100V42h58v58M136 100V10h58v90M224 100V68h58v32"/>
        <path d="M20 138h255" stroke="#e63946" stroke-width="6"/>
      </g>
      <text x="0" y="462" font-size="21" fill="#555">Le verrou n'est plus seulement technique.</text>
      <text x="0" y="494" font-size="21" fill="#555">C'est la capacité à imaginer un premier usage.</text>
    </g>

    <line x1="72" y1="820" x2="1464" y2="820" stroke="#1a1a1a" stroke-width="2"/>
    <text x="72" y="858" font-size="17" letter-spacing="2" fill="#666">BPIFRANCE LE LAB · BAROMÈTRE SEMESTRIEL · JANVIER 2026</text>
  </g>
</svg>
